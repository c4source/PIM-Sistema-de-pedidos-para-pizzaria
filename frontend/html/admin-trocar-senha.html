<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trocar senha | Madalena Pizzaria</title><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/admin.css"><link rel="stylesheet" href="../css/admin-colaboradores.css"></head>
<body><div class="app admin-login-app"><main class="admin-login-main"><section class="admin-login-card"><h1 class="admin-login-title">Defina sua senha</h1><p>No primeiro acesso, substitua a senha provisória para entrar no painel.</p>
<form id="troca-form"><div class="admin-login-field"><label for="nova-senha">Nova senha</label><input class="admin-login-input" id="nova-senha" name="senha" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></div><div class="admin-login-field"><label for="confirmacao">Confirme a nova senha</label><input class="admin-login-input" id="confirmacao" name="confirmacao" type="password" autocomplete="new-password" required></div><p>Mínimo de 8 caracteres. Escolha uma senha diferente da provisória.</p><p id="troca-erro" role="alert" class="admin-login-error"></p><button type="submit" class="primary-button">Salvar senha e entrar</button></form><a href="./admin-login.html" id="cancelar-troca">Voltar ao login</a></section></main></div><script src="../js/admin-api.js"></script><script src="../js/admin-trocar-senha.js"></script></body></html>
