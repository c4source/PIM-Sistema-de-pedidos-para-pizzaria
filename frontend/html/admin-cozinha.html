<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fila da Cozinha | Pizzaria MVP</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body>
    <div class="app admin-kitchen-app">
      <header class="admin-kitchen-header">
        <div class="admin-kitchen-heading">
          <h1 class="admin-kitchen-title">Fila da Cozinha</h1>
          <p class="admin-kitchen-subtitle">Acompanhe os pedidos em preparo</p>
        </div>

        <div class="admin-kitchen-header-actions">
          <button
            class="secondary-button admin-kitchen-secondary-button"
            id="admin-kitchen-back-dashboard"
            type="button"
          >
            Voltar ao painel
          </button>
          <button
            class="secondary-button admin-kitchen-secondary-button"
            id="admin-kitchen-orders-link"
            type="button"
          >
            Ver pedidos
          </button>
          <button
            class="primary-button admin-kitchen-logout-button"
            id="admin-kitchen-logout"
            type="button"
          >
            Sair
          </button>
        </div>
      </header>

      <main class="admin-kitchen-main">
        <section class="admin-kitchen-summary" aria-label="Resumo da fila da cozinha">
          <article class="admin-kitchen-summary-card">
            <span class="admin-kitchen-summary-label">Recebidos</span>
            <strong class="admin-kitchen-summary-value" id="kitchen-received-count">0</strong>
          </article>

          <article class="admin-kitchen-summary-card">
            <span class="admin-kitchen-summary-label">Em preparo</span>
            <strong class="admin-kitchen-summary-value" id="kitchen-preparing-count">0</strong>
          </article>

          <article class="admin-kitchen-summary-card">
            <span class="admin-kitchen-summary-label">Prontos</span>
            <strong class="admin-kitchen-summary-value" id="kitchen-ready-count">0</strong>
          </article>

          <article class="admin-kitchen-summary-card">
            <span class="admin-kitchen-summary-label">Total na fila</span>
            <strong class="admin-kitchen-summary-value" id="kitchen-total-count">0</strong>
          </article>
        </section>

        <section class="admin-kitchen-board" aria-label="Pedidos da cozinha">
          <article class="admin-kitchen-column">
            <div class="admin-kitchen-column-header">
              <h2 class="admin-kitchen-column-title">Recebidos</h2>
              <span class="admin-kitchen-column-status admin-kitchen-status-recebido"
                >Recebido</span
              >
            </div>
            <div class="admin-kitchen-list" id="kitchen-received-list"></div>
          </article>

          <article class="admin-kitchen-column">
            <div class="admin-kitchen-column-header">
              <h2 class="admin-kitchen-column-title">Em preparo</h2>
              <span class="admin-kitchen-column-status admin-kitchen-status-em_preparo"
                >Em preparo</span
              >
            </div>
            <div class="admin-kitchen-list" id="kitchen-preparing-list"></div>
          </article>

          <article class="admin-kitchen-column">
            <div class="admin-kitchen-column-header">
              <h2 class="admin-kitchen-column-title">Prontos</h2>
              <span class="admin-kitchen-column-status admin-kitchen-status-pronto">Pronto</span>
            </div>
            <div class="admin-kitchen-list" id="kitchen-ready-list"></div>
          </article>
        </section>
      </main>
    </div>

    <script src="../js/admin-api.js"></script>
    <script src="../js/admin-session.js"></script>
    <script src="../js/admin-cozinha.js"></script>
  </body>
</html>
